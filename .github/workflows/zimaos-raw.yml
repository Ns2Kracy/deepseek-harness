# Build the Linux amd64 ZimaOS extension on every change and move the rolling
# `latest` release only after a dsh-v* tag build has passed.
name: ZimaOS RAW

on:
  pull_request: {}
  push:
    branches:
      - master
    tags:
      - "dsh-v*"

concurrency:
  group: zimaos-raw-${{ startsWith(github.ref, 'refs/tags/dsh-v') && 'release' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux amd64 RAW
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install image tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq musl-tools squashfs-tools xz-utils

      - name: Build and probe RAW image
        run: pnpm run build:zimaos-raw

      - name: Verify checksum
        run: sha256sum -c deepseek_harness.raw.sha256

      - name: Upload RAW artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: zimaos-raw-${{ github.sha }}
          path: |
            deepseek_harness.raw
            deepseek_harness.raw.sha256
          if-no-files-found: error
          retention-days: 14

  publish-preview:
    name: Publish rolling preview release
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: zimaos-raw-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified RAW artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: zimaos-raw-${{ github.sha }}

      - name: Verify downloaded RAW checksum
        run: sha256sum -c deepseek_harness.raw.sha256

      - name: Stage and publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          preview_ref=refs/tags/zimaos-raw-preview
          observed_oid="$(git ls-remote --tags origin "$preview_ref" | awk '{print $1}')"
          releases="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          release_ids="$(jq '[.[][] | select(.tag_name == "zimaos-raw-preview" or (.draft and .prerelease and .name == "DeepSeek Harness ZimaOS RAW (preview)" and (.tag_name | startswith("untagged-")))) | .id]' <<<"$releases")"
          if (( $(jq 'length' <<<"$release_ids") > 1 )); then
            echo 'Multiple recoverable ZimaOS RAW preview drafts exist.' >&2
            exit 1
          fi
          release_id="$(jq -r '.[0] // empty' <<<"$release_ids")"

          if [[ -n "$release_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=true -F prerelease=true >/dev/null
          else
            if [[ -n "$observed_oid" ]]; then
              echo 'Refusing to create zimaos-raw-preview because its tag already exists without a Release.' >&2
              exit 1
            fi
            release_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name=zimaos-raw-preview -f target_commitish="$GITHUB_SHA" \
              -f name='DeepSeek Harness ZimaOS RAW (preview)' \
              -f body='Rolling Linux amd64 ZimaOS RAW build from the latest same-repository pull request. Preview builds may be replaced without notice.' \
              -F draft=true -F prerelease=true --jq .id)"
          fi

          assets="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100")"
          asset_ids="$(jq '[.[][] | .id]' <<<"$assets")"
          for asset_id in $(jq -r '.[]' <<<"$asset_ids"); do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done
          for asset in deepseek_harness.raw deepseek_harness.raw.sha256; do
            gh api --method POST --hostname uploads.github.com \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$asset" \
              -H 'Content-Type: application/octet-stream' --input "$asset" >/dev/null
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            | jq -e '.draft == true and .prerelease == true
              and ([.assets[].name] | sort) == ["deepseek_harness.raw", "deepseek_harness.raw.sha256"]'

          git tag -f zimaos-raw-preview "$GITHUB_SHA"
          gh auth setup-git
          if [[ -n "$observed_oid" ]]; then
            git push origin "$preview_ref" \
              --force-with-lease="$preview_ref:$observed_oid"
          else
            git push origin "$preview_ref"
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -f tag_name=zimaos-raw-preview -f target_commitish="$GITHUB_SHA" \
            -F draft=false -F prerelease=true -f make_latest=false >/dev/null
          gh release view zimaos-raw-preview --json isDraft,isPrerelease,tagName,assets \
            | jq -e '.isDraft == false and .isPrerelease == true and .tagName == "zimaos-raw-preview"
              and ([.assets[].name] | sort) == ["deepseek_harness.raw", "deepseek_harness.raw.sha256"]'

  publish-latest:
    name: Publish rolling latest release
    if: startsWith(github.ref, 'refs/tags/dsh-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified RAW artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: zimaos-raw-${{ github.sha }}

      - name: Verify downloaded RAW checksum
        run: sha256sum -c deepseek_harness.raw.sha256

      - name: Stage and publish latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_ref=refs/tags/latest
          observed_oid="$(git ls-remote --tags origin "$latest_ref" | awk '{print $1}')"
          newest_tag="$(git tag --list 'dsh-v*' --sort=-v:refname | head -n1)"
          if [[ "$GITHUB_REF_NAME" != "$newest_tag" ]]; then
            echo "Refusing to move latest backwards from $newest_tag to $GITHUB_REF_NAME." >&2
            exit 1
          fi

          releases="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          release_ids="$(jq '[.[][] | select(.tag_name == "latest" or (.draft and (.prerelease | not) and .name == "DeepSeek Harness ZimaOS RAW (latest)" and (.tag_name | startswith("untagged-")))) | .id]' <<<"$releases")"
          if (( $(jq 'length' <<<"$release_ids") > 1 )); then
            echo 'Multiple recoverable ZimaOS RAW latest drafts exist.' >&2
            exit 1
          fi
          release_id="$(jq -r '.[0] // empty' <<<"$release_ids")"

          if [[ -n "$release_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=true -F prerelease=false >/dev/null
          else
            release_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name=latest -f target_commitish="$GITHUB_SHA" \
              -f name='DeepSeek Harness ZimaOS RAW (latest)' \
              -f body='Rolling Linux amd64 ZimaOS RAW build from the latest dsh-v* tag.' \
              -F draft=true -F prerelease=false --jq .id)"
          fi

          assets="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100")"
          asset_ids="$(jq '[.[][] | .id]' <<<"$assets")"
          for asset_id in $(jq -r '.[]' <<<"$asset_ids"); do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done
          for asset in deepseek_harness.raw deepseek_harness.raw.sha256; do
            gh api --method POST --hostname uploads.github.com \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$asset" \
              -H 'Content-Type: application/octet-stream' --input "$asset" >/dev/null
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            | jq -e '.draft == true and .prerelease == false
              and ([.assets[].name] | sort) == ["deepseek_harness.raw", "deepseek_harness.raw.sha256"]'

          git tag -f latest "$GITHUB_SHA"
          gh auth setup-git
          if [[ -n "$observed_oid" ]]; then
            git push origin "$latest_ref" \
              --force-with-lease="$latest_ref:$observed_oid"
          else
            git push origin "$latest_ref"
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -f tag_name=latest -f target_commitish="$GITHUB_SHA" \
            -F draft=false -F prerelease=false -f make_latest=true >/dev/null
          gh release edit latest --latest
          gh release view latest --json isDraft,isPrerelease,tagName,assets \
            | jq -e '.isDraft == false and .isPrerelease == false and .tagName == "latest"
              and ([.assets[].name] | sort) == ["deepseek_harness.raw", "deepseek_harness.raw.sha256"]'
